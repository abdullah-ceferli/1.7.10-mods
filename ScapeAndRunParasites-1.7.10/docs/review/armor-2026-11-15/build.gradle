buildscript {
    repositories { mavenCentral(); maven { url = 'https://maven.minecraftforge.net/' } }
    dependencies { classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.1' }
}
apply plugin: 'forge'
apply plugin: 'java'
group = 'local.backport.srparasites'
version = '1.10.9-backport-dev'
archivesBaseName = 'SRParasites-1.7.10'
sourceCompatibility = targetCompatibility = '1.8'
minecraft { version = '1.7.10-10.13.4.1614-1.7.10'; runDir = '.toolchain/run' }
dependencies { compileOnly files('.toolchain/upstream-libraries.jar') }
tasks.withType(JavaCompile) { options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none'] }
processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand 'version': project.version }
}
// This is an unfinished source conversion. A failed compile must never produce a release JAR.
task sourceArchive(type: Zip) { archiveClassifier.set('work-in-progress'); from('src'); into('src') }

// ForgeGradle 1.2 discovers *_at.cfg resources for development; FML reads this manifest at runtime.
jar { manifest { attributes 'FMLAT': 'srp_at.cfg', 'FMLCorePlugin': 'com.dhanantry.scapeandrunparasites.backport.potion.core.PotionFxLoadingPlugin', 'FMLCorePluginContainsFMLMod': 'true' } }
