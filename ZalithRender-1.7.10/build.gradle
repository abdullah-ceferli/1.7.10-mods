buildscript {
    repositories { mavenCentral(); maven { url = 'https://maven.minecraftforge.net/' } }
    dependencies { classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.1' }
}
apply plugin: 'forge'
version='0.2.0'
group='dev.zahin.zalithrender'
archivesBaseName='ZalithRender-1.7.10'
sourceCompatibility=targetCompatibility='1.8'
minecraft { version='1.7.10-10.13.4.1614-1.7.10'; runDir='run' }
tasks.withType(JavaCompile) { options.encoding='UTF-8' }
jar {
    manifest { attributes 'FMLCorePlugin':'dev.zahin.zalithrender.core.RenderCore','FMLCorePluginContainsFMLMod':'true','Implementation-Version':project.version }
    from('LICENSE') { into 'META-INF' }
}
